[workspace]
members = [
    ".",
    "crates/ghost-llm-helper",
    "crates/sk-clipboard",
    "crates/sk-one-window",
    "crates/sk-protocol",
    "crates/sk-storage",
]
resolver = "2"

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
# GPUI is the gpui-pre 0.3.6 snapshot (zed@bcf6582) published with gpui-kit;
# Script Kit patches live in vendor/gpui* and are applied via [patch.crates-io].
gpui = { package = "gpui-pre", version = "=0.3.6", features = ["test-support"] }
gpui-macros = { package = "gpui-pre-macros", version = "=0.3.6" }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "c15662463bda39148ba154100dd44d3fba5873a4", default-features = false, features = ["charset", "http2", "macos-system-configuration", "multipart", "rustls-tls-native-roots", "socks", "stream"], package = "zed-reqwest", version = "0.12.15-zed" }
anyhow = "1"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "7.0.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf", "metric_utf16"] }
rust-i18n = "3"
schemars = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
tracing = "0.1.41"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"

[package]
name = "script-kit-gpui"
version = "0.1.21"
edition = "2021"
default-run = "script-kit-gpui"
autobins = false

[lib]
name = "script_kit_gpui"
path = "src/lib.rs"

[[bin]]
name = "script-kit-gpui"
path = "src/main.rs"
test = false  # Tests run via lib.rs only - avoids duplicate test runs

[[bin]]
name = "export_design_tokens"
path = "src/bin/export_design_tokens.rs"
test = false  # Behavior is covered by design_contract lib tests

[[bin]]
name = "liquid-glass-demo"
path = "src/bin/liquid_glass_demo.rs"
test = false  # Standalone visual proof-of-concept, no test surface

[dependencies]
sk-clipboard = { path = "crates/sk-clipboard" }
sk-one-window = { path = "crates/sk-one-window" }
sk-protocol = { path = "crates/sk-protocol" }
sk-storage = { path = "crates/sk-storage" }
gpui = { package = "gpui-pre", version = "=0.3.6", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["font-kit"] }
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.6" }
gpui_macros = { package = "gpui-pre-macros", version = "=0.3.6" }
global-hotkey = "0.7"
notify = "8.0"
# System notifications (Notification Center on macOS via mac-notification-sys).
# Replaces the earlier `osascript -e 'display notification ...'` shell-out for the
# `notify(...)` SDK API; keeps one crate in control of escaping / delivery.
notify-rust = "4"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"        # YAML frontmatter parsing for scriptlet bundles
shellexpand = "2.1"
dirs = "5.0"
smallvec = "1.15"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "default-fancy"] }
anyhow = "1.0"
thiserror = "2.0"
regex = "1.12"
jsonschema = { version = "0.29.1", default-features = false }
nucleo-matcher = "0.3"         # High-performance fuzzy matching (10-100x faster than bespoke)
unicode-segmentation = "1.12"  # Text-field caret moves by visible character
pulldown-cmark = { version = "0.12", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "time", "tracing-log"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
chrono-english = "0.1.8"
chrono-tz = "0.10"
itertools = "0.14"
strum = { version = "0.26", features = ["derive"] }
humantime = "2"
humansize = "2"

# Terminal integration dependencies (Tier 2 - Alacritty)
# Versions chosen to match Zed's current known-working configuration (Dec 2025)
portable-pty = "0.9"           # PTY management for process spawning
alacritty_terminal = "0.25"    # Zed uses 0.25.1-rc1, this gets latest 0.25.x stable
vte = "0.15"                   # ANSI escape sequence parser, required by alacritty_terminal 0.25
bitflags = "2.10"              # For cell attribute flags
async-channel = "2.3"          # Async channel for stdin command listener
smol.workspace = true          # future::or for the main-hotkey gesture listener select

# Local speech-to-text (dictation): GGUF Parakeet/Whisper via transcribe.cpp on
# ggml, Metal GPU by default with a CPU fallback.
transcribe-cpp = "0.4"
rustfft = "6"                  # FFT-based audio visualization for dictation waveform
block = "0.1"                  # Objective-C block support for NSEvent global monitor

flate2 = "1.0"

# Selected text functionality (getSelectedText/setSelectedText)
arboard = "3.6"                # Clipboard access for setSelectedText fallback

# System tray / menu bar integration
tray-icon = "0.21"                    # Cross-platform tray icon (includes muda for menus)
resvg = "0.45"                        # SVG to PNG conversion for tray icon
usvg = "0.45"                         # SVG parsing (used by resvg)
tiny-skia = "0.11"                    # 2D graphics library for SVG rendering

# Clipboard history storage
rusqlite = { version = "0.38", default-features = false, features = ["bundled"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
base64 = "0.22"
lru = "0.12"  # LRU cache for clipboard image eviction
sha2 = "0.10"  # SHA-256 for content hash dedup
semver = "1"

# Image decoding for app icons
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Parallel iteration for app scanning
rayon = "1.10"

# Cross-platform window screenshot capture
xcap = "0.8"

# File modification time handling for icon cache
filetime = "0.2"
glob = "0.3.3"
libc = "0.2.178"
raw-window-handle = "0.6"

# Age encryption for secrets storage (alternative to keyring)
# New vaults use age X25519 and a private macOS Keychain identity.
age = "0.11"
hostname = "0.4"  # Read-only compatibility with legacy vaults.

# Process monitoring for orphan detection and cleanup
sysinfo = "0.37"

# Non-poisoning mutex (doesn't require .unwrap() on lock)
parking_lot = "0.12"

# Open URLs and files with system default handler
open = "5"

# Math expression evaluation for calculate fallback
meval = "0.2"

# gpui-component = gpui-kit (Longbridge gpui-component 0.6.6). Script Kit
# extensions are patched into vendor/gpui-kit (see vendor/gpui-kit/SCRIPT_KIT_PATCHES.md).
gpui-component = { version = "=0.6.6", features = ["tree-sitter-languages", "test-support"] }
# gpui-kit (Longbridge gpui-component 0.6) and gpui-ai, both linked against the
# single patched gpui-pre above. gpui-ai reads gpui-kit's active theme, which
# src/theme/gpui_kit_bridge.rs keeps synced from the Script Kit theme.
gpui-ai = { version = "=0.8.0" }
# Embedded Lucide icon SVGs for gpui-component's IconName paths ("icons/monitor.svg").
# Registered as the app AssetSource fallback in src/utils/assets.rs — without an
# asset source, every svg().path(...) icon silently renders nothing.
gpui-component-assets = { package = "gpui-kit-assets", version = "=0.6.6" }
# Script Kit's Lucide SVG catalog (legacy names scripts/themes accept).
script-kit-lucide-assets = { path = "vendor/script-kit-lucide-assets" }
# Embed Script Kit's own assets/icons/*.svg (EmbeddedIcon paths) into the binary.
# debug-embed: embed assets in debug builds too, so dev/driver binaries
# exercise the exact embedded-asset loading the released .app uses
# (P0 2026-06-11: filesystem icon paths broke only in release bundles).
rust-embed = { version = "8.7", features = ["debug-embed"] }

# Tree-sitter markdown grammar for Notes editor highlighting
tree-sitter-md = "0.5.2"


# Cron scheduling support
croner = "3.0"                 # Parse and validate cron expressions
english-to-cron = "0.1"        # Convert natural language schedules to cron

# HTTP client for AI provider API calls
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
# Agent tools (src/mcp_agent_tools): URL handling, file walking, glob matching
url = "2"
percent-encoding = "2"
walkdir = "2"
globset = "0.4"

which = "8.0.0"
hex = "0.4.3"

async-trait = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time", "process", "io-util", "io-std"] }
tokio-util = { version = "0.7", features = ["compat"] }

# Secure temporary file creation (moved from dev-dependencies for production use)
tempfile = "3"
tree-sitter = "0.26"
tree-sitter-typescript = "0.23.2"
chrono-humanize = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
# Note: We use core-graphics directly for Cmd+V simulation (more reliable than enigo on macOS)
core-graphics = "0.24"
cocoa = "0.26"
core-video = { version = "0.5.2", features = ["metal"] }
objc = "0.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace"] }
# Catch Obj-C NSExceptions (e.g. NSPasteboard "collection mutated while
# enumerated") and turn them into recoverable Rust errors instead of aborting
# the process. See src/platform/accessibility/clipboard.rs::capture.
objc_exception = "0.1"
macos-accessibility-client = "0.0.1"  # Permission checking for accessibility APIs
# Core Foundation for CFRunLoop (keyboard monitoring)
core-foundation = "0.10"
foreign-types = "0.5"
# macOS launch-at-login via SMAppService
smappservice-rs = "0.1"

[patch.crates-io]
# Script Kit's GPUI patch set, ported onto gpui-pre 0.3.6 (zed@bcf6582). Every
# crate in the graph that asks for gpui-pre (gpui-component, gpui-ai) links
# these patched copies, so there is exactly one GPUI in the binary.
gpui-pre = { path = "vendor/gpui" }
gpui-pre-macos = { path = "vendor/gpui_macos" }
gpui-pre-apple = { path = "vendor/gpui_apple" }
gpui-pre-platform = { path = "vendor/gpui_platform" }
gpui-pre-macros = { path = "vendor/gpui_macros" }
# gpui-kit 0.6.6 with Script Kit's component extensions (ported from the former
# gpui-component 0.5 fork) so gpui-ai and the app share one patched library.
gpui-component = { path = "vendor/gpui-kit/gpui-component" }
gpui-base = { path = "vendor/gpui-kit/gpui-base" }
gpui-component-macros = { path = "vendor/gpui-kit/gpui-component-macros" }
gpui-kit-assets = { path = "vendor/gpui-kit/gpui-kit-assets" }

[features]
default = ["ocr"]
owned-ui-evaluation = ["gpui_platform/test-support"]
# On-device GGUF ghost-text engine via llama.cpp (Metal). OFF by default until
# the ggml/whisper double-link is proven clean on macOS CI; enable with
# `--features local-llm`. See src/ai/local_llm/.
local-llm = []
# Enable tests that interact with system APIs (clipboard, accessibility, hotkeys)
# These tests may have side effects like modifying clipboard, opening dialogs, etc.
# Run with: cargo test --features system-tests
system-tests = []
# Enable slow tests that spawn shell processes (sleep, bash, zsh, etc.)
# These tests add ~30+ seconds to the test suite.
# Run with: cargo test --features slow-tests
slow-tests = []
# OCR support using macOS Vision framework (enabled by default on macOS)
ocr = []
# Performance instrumentation (disabled by default to reduce hot-path overhead)
# Enables key event timing, scroll timing, and rate logging
# Run with: cargo build --features perf
perf = []
[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter-highlight = "0.26"
temp-env = "0.3.6"

[profile.dev]
debug = 0
incremental = true
codegen-units = 256

# Scroll/animation frame cost is dominated by layout+paint code in gpui,
# gpui-component, and taffy; at opt-level 0 a dev build misses the frame
# budget whenever background load (cargo watch, embedder) competes for cores.
# Optimize dependencies once at compile time while the app crate itself stays
# opt-level 0 for fast incremental rebuilds. `package."*"` skips workspace
# members, so the vendored UI crates are listed explicitly.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.gpui-pre]
opt-level = 2

[profile.dev.package.gpui-component]
opt-level = 2

[profile.dev.package.gpui-pre-util]
opt-level = 2

[profile.dev.package.gpui-pre-macos]
opt-level = 2

[profile.dev.package.gpui-pre-platform]
opt-level = 2

[profile.test]
debug = 1
incremental = true
codegen-units = 256

# The interactive dev binary keeps its calibrated -O2 UI dependencies above,
# but correctness-only test harnesses must not optimize the entire dependency
# graph. `test` inherits `dev`, so without these explicit overrides every
# filtered Rust regression recompiles Whisper, ONNX, GPUI, and hundreds of
# unrelated crates at -O2 before running even one assertion.
[profile.test.package."*"]
opt-level = 0

[profile.test.package.gpui-pre]
opt-level = 0

[profile.test.package.gpui-component]
opt-level = 0

[profile.test.package.gpui-pre-util]
opt-level = 0

[profile.test.package.gpui-pre-macos]
opt-level = 0

[profile.test.package.gpui-pre-platform]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# macOS bundle metadata for cargo-bundle.
# Canonical ship path: cargo bundle --release --bin script-kit-gpui
[package.metadata.bundle.bin.script-kit-gpui]
name = "Script Kit"
identifier = "com.scriptkit.app"
icon = ["assets/icon.png", "assets/icon@2x.png", "assets/icon.icns"]
version = "0.1.21"
copyright = "Copyright (c) 2024 Script Kit. All rights reserved."
category = "public.app-category.developer-tools"
short_description = "Automation made simple"
osx_minimum_system_version = "11.0" # arm64 app and sidecar Mach-O deployment floor
osx_url_schemes = ["scriptkit"]
resources = [
    "assets/Info.plist.ext",
    "assets/icon.png",
    "assets/icon@2x.png",
    "assets/icon.icns",
    "assets/logo.svg",
    "assets/icons/*.svg",
    "assets/fonts/*.ttf",
    "assets/fonts/*.txt",
    # Runtime for the Migrate v1 board. scripts/verify-macos-bundle.sh checks
    # source-to-bundle parity for these globs so new engine modules ship too.
    "scripts/kit-sdk.ts",
    "scripts/migrate/*.ts",
    "scripts/migrate/*.json",
    "scripts/migrate/prompts/*.md",
]
# LSUIElement makes app an "agent app" - no menu bar, no Dock icon (like Raycast)
osx_info_plist_exts = ["assets/Info.plist.ext"]
