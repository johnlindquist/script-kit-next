name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "2"
  CMAKE_BUILD_PARALLEL_LEVEL: "1"
  SDK_TEST_CONCURRENCY: "2"
  # Incremental Rust units bypass sccache; release runners reuse remote cache.
  CARGO_INCREMENTAL: "0"
  SCRIPT_KIT_NONINTERACTIVE: "1"
  SCRIPT_KIT_ALLOW_SCREEN_TAKEOVER: "0"
  SCRIPT_KIT_ALLOW_NATIVE_INPUT: "0"
  SCRIPT_KIT_ALLOW_SCREEN_CAPTURE: "0"
  SCRIPT_KIT_ALLOW_VISIBLE_PROBES: "0"
  SCRIPT_KIT_ALLOW_LIVE_AI: "0"
  SCRIPT_KIT_ALLOW_ISOLATED_APP_LAUNCH: "0"
  SCRIPT_KIT_REQUIRE_CLEAN_SOURCE: "1"

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify tag matches Cargo.toml version
        run: bash scripts/verify-release-version.sh

  validate-fmt:
    name: Validate release format
    runs-on: macos-15
    needs: validate-version
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install root-pinned Rust toolchain
        run: bash scripts/install-root-rust-toolchain.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Validate format
        run: bash scripts/verify.sh --skip-bundle --only fmt

  validate-check:
    name: Validate release check
    runs-on: macos-15
    needs: [validate-fmt, validate-sdk-types, validate-sdk-tests]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install root-pinned Rust toolchain
        run: bash scripts/install-root-rust-toolchain.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-debug"
          cache-targets: false
          save-if: false
      - name: Validate check
        run: bash scripts/verify.sh --skip-bundle --only check

  validate-clippy:
    name: Validate release clippy
    runs-on: macos-15
    needs: [validate-fmt, validate-sdk-types, validate-sdk-tests]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install root-pinned Rust toolchain
        run: bash scripts/install-root-rust-toolchain.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-debug"
          cache-targets: false
          save-if: false
      - name: Validate clippy
        run: bash scripts/verify.sh --skip-bundle --only clippy

  validate-tests:
    name: Execute release Rust behavior
    runs-on: macos-15
    needs: [validate-fmt, validate-sdk-types, validate-sdk-tests]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install root-pinned Rust toolchain
        run: bash scripts/install-root-rust-toolchain.sh
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-debug"
          cache-targets: false
          save-if: false
      - uses: taiki-e/install-action@nextest
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Execute application Rust tests
        env:
          SCRIPT_KIT_VERIFY_RECEIPT: ${{ runner.temp }}/release-rust-evidence/rust-tests.json
          SCRIPT_KIT_VERIFY_TEST_LOG: ${{ runner.temp }}/rust-tests.log
        run: bash scripts/verify.sh --skip-bundle --only test
      - name: Execute named nonintrusive integration behavior suites
        env:
          SCRIPT_KIT_VERIFY_RECEIPT: ${{ runner.temp }}/release-rust-evidence/integration-tests.json
          SCRIPT_KIT_VERIFY_TEST_LOG: ${{ runner.temp }}/integration-tests.log
        run: bash scripts/verify.sh --skip-bundle --only integration-tests
      - name: Execute app-independent domain tests
        env:
          SCRIPT_KIT_VERIFY_RECEIPT: ${{ runner.temp }}/release-rust-evidence/domain-tests.json
          SCRIPT_KIT_VERIFY_TEST_LOG: ${{ runner.temp }}/domain-tests.log
        run: bash scripts/verify.sh --skip-bundle --only domain-tests
      - name: Prove fresh-install seeding in an isolated temporary fixture
        env:
          SCRIPT_KIT_VERIFY_RECEIPT: ${{ runner.temp }}/release-rust-evidence/first-run-fixtures.json
          SCRIPT_KIT_VERIFY_TEST_LOG: ${{ runner.temp }}/first-run-fixtures.log
        run: bash scripts/verify.sh --skip-bundle --only first-run-fixtures
      - name: Prove denied permissions remain truthful without accessing devices
        env:
          SCRIPT_KIT_VERIFY_RECEIPT: ${{ runner.temp }}/release-rust-evidence/permissions-fixtures.json
          SCRIPT_KIT_VERIFY_TEST_LOG: ${{ runner.temp }}/permissions-fixtures.log
        run: bash scripts/verify.sh --skip-bundle --only permissions-fixtures
      - name: Prove mock AI failure offers recovery without starting a provider
        env:
          SCRIPT_KIT_VERIFY_RECEIPT: ${{ runner.temp }}/release-rust-evidence/mock-ai-fixtures.json
          SCRIPT_KIT_VERIFY_TEST_LOG: ${{ runner.temp }}/mock-ai-fixtures.log
        run: bash scripts/verify.sh --skip-bundle --only mock-ai-fixtures
      - name: Prove diagnostic secret and user-path redaction with mock data
        env:
          SCRIPT_KIT_VERIFY_RECEIPT: ${{ runner.temp }}/release-rust-evidence/privacy-fixtures.json
          SCRIPT_KIT_VERIFY_TEST_LOG: ${{ runner.temp }}/privacy-fixtures.log
        run: bash scripts/verify.sh --skip-bundle --only privacy-fixtures
      - name: Upload executed Rust behavior receipts
        uses: actions/upload-artifact@v4
        with:
          name: release-rust-evidence
          path: ${{ runner.temp }}/release-rust-evidence/*.json
          if-no-files-found: error

  validate-proof-contracts:
    needs: [validate-fmt, validate-sdk-types, validate-sdk-tests]
    uses: ./.github/workflows/release-compiler-proof.yml

  validate-sdk-types:
    name: Validate release SDK types
    runs-on: macos-15
    needs: validate-version
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Validate SDK types
        run: bash scripts/verify.sh --skip-bundle --only sdk-types

  validate-sdk-tests:
    name: Validate release SDK tests
    runs-on: macos-15
    needs: validate-version
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Validate SDK tests
        id: sdk
        env:
          SCRIPT_KIT_SDK_TEST_RECEIPT: ${{ runner.temp }}/sdk-tests-summary.json
          SCRIPT_KIT_VERIFY_RECEIPT: ${{ runner.temp }}/release-sdk-evidence/sdk-tests.json
        run: bash scripts/verify.sh --skip-bundle --only sdk-tests
      # Never upload raw SDK results. A failing job keeps its diagnosis, not a passing receipt.
      - name: Locate failing SDK cases
        if: ${{ failure() && steps.sdk.outcome == 'failure' }}
        env:
          DIAGNOSTIC_TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bun scripts/diagnostics/sdk-case-report.ts "$RUNNER_TEMP/sdk-tests-summary.json" | tee "$RUNNER_TEMP/sdk-case-report.json"
      - name: Keep SDK failure locations
        if: ${{ failure() && steps.sdk.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-sdk-diagnostic-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-case-report.json
          retention-days: 5
          if-no-files-found: error
      - name: Upload complete SDK behavior receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-sdk-evidence
          path: ${{ runner.temp }}/release-sdk-evidence/sdk-tests.json
          if-no-files-found: error

  validate-release-gates:
    name: Validate release gates
    runs-on: ubuntu-latest
    outputs:
      proof_id: ${{ needs.validate-proof-contracts.outputs.primary-evidence || needs.validate-proof-contracts.outputs.recovered-evidence }}
    if: ${{ always() }}
    needs:
      - validate-version
      - validate-fmt
      - validate-check
      - validate-clippy
      - validate-tests
      - validate-proof-contracts
      - validate-sdk-types
      - validate-sdk-tests
      - build-macos-app
    steps:
      - name: Fail closed if any release gate failed
        env:
          PRIMARY_EVIDENCE: ${{ needs.validate-proof-contracts.outputs.primary-evidence }}
          RECOVERY_KEY: ${{ needs.validate-proof-contracts.outputs.recovery-key }}
          RECOVERED_EVIDENCE: ${{ needs.validate-proof-contracts.outputs.recovered-evidence }}
          DESIGN_ID: ${{ needs.build-macos-app.outputs.design_id }}
        run: |
          test "${{ needs['validate-version'].result }}" = "success"
          test "${{ needs['validate-fmt'].result }}" = "success"
          test "${{ needs['validate-check'].result }}" = "success"
          test "${{ needs['validate-clippy'].result }}" = "success"
          test "${{ needs['validate-tests'].result }}" = "success"
          test "${{ needs['validate-proof-contracts'].result }}" = "success"
          if test -z "$RECOVERY_KEY"; then
            [[ "$PRIMARY_EVIDENCE" =~ ^[1-9][0-9]*$ && -z "$RECOVERED_EVIDENCE" ]] || exit 1
          else
            [[ -z "$PRIMARY_EVIDENCE" && "$RECOVERED_EVIDENCE" =~ ^[1-9][0-9]*$ ]] || exit 1
          fi
          test "${{ needs['validate-sdk-types'].result }}" = "success"
          test "${{ needs['validate-sdk-tests'].result }}" = "success"
          test "${{ needs['build-macos-app'].result }}" = "success"
          [[ "$DESIGN_ID" =~ ^[1-9][0-9]*$ ]]

  build-macos-app:
    name: Build unsigned macOS app
    runs-on: macos-15
    needs: [validate-fmt, validate-sdk-types, validate-sdk-tests]
    outputs:
      unsigned_id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      design_id: ${{ steps.upload-design.outputs.artifact-id }}
      compile_receipt_sha: ${{ steps.seal-compile.outputs.digest }}
    env:
      # The managed builder qualifies sccache itself; it is a cache, not a semantic compiler wrapper.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install root-pinned Rust toolchain
        run: bash scripts/install-root-rust-toolchain.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-managed-release"
          workspaces: ". -> target-agent/pools/agent-debug"
          cache-all-crates: true
          cache-on-failure: true

      - name: Cache cargo-bundle
        id: cache-cargo-bundle
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-bundle
          key: cargo-bundle-2be2669972dff3ddd4daf89a2cb29d2d06cad7c7-${{ runner.os }}

      - name: Install cargo-bundle
        if: steps.cache-cargo-bundle.outputs.cache-hit != 'true'
        run: cargo install cargo-bundle --git https://github.com/zed-industries/cargo-bundle.git --rev 2be2669972dff3ddd4daf89a2cb29d2d06cad7c7 --locked

      - name: Verify cargo-bundle is available
        run: cargo bundle --help >/dev/null

      - name: Compile the release application once (unprivileged)
        env:
          SCRIPT_KIT_AGENT_OWNED_COMPILER_SAMPLE: "1"
          CARGO_BUILD_JOBS: "1"
          SCRIPT_KIT_AGENT_TIMEOUT_MS: "5400000"
        run: |
          mkdir -p .test-output/release
          bun scripts/devtools/devtools.ts build-ops act app-build \
            --profile release --features owned-ui-evaluation --timeout-ms 5400000 \
            --artifact-out .test-output/release/compile.reference.json

      - name: Check the compiled launcher before it reaches signing
        run: |
          bun scripts/agentic/root-search-frame-stability.ts \
            --artifact .test-output/release/compile.reference.json \
            --receipt .test-output/release/unsigned-root-frame.json

      - name: Bundle the verified executable without invoking cargo build
        run: |
          BIN="$(bun scripts/agentic/build-artifact.ts verify-reference "$PWD" .test-output/release/compile.reference.json)"
          CHECK="$RUNNER_TEMP/unsigned-workspace-check.json"
          BUN_DIR="$(dirname "$(command -v bun)")"
          (cd "$RUNNER_TEMP" && PATH="$BUN_DIR:/usr/bin:/bin" "$BIN" --check-installation) >"$CHECK"
          jq -e --arg version "${GITHUB_REF_NAME#v}" --argjson packaged false -f scripts/verify-installed-workspace.jq "$CHECK" >/dev/null
          mkdir -p target/release
          install -m 0755 "$BIN" target/release/script-kit-gpui
          CARGO_BUNDLE_SKIP_BUILD=1 cargo bundle --release --bin script-kit-gpui --features owned-ui-evaluation

      - name: Seal exact compile and unsigned ZIP for the signing runner
        id: seal-compile
        run: |
          set -euo pipefail
          APP="target/release/bundle/osx/Script Kit.app"
          mkdir -p artifacts/unsigned-transfer
          ZIP=artifacts/unsigned-transfer/Script-Kit-unsigned-app.zip
          /usr/bin/ditto -c -k --keepParent "$APP" "$ZIP"
          DIGEST="$(bun scripts/agentic/release-compile.ts seal .test-output/release/compile.reference.json \
            "$APP/Contents/MacOS/script-kit-gpui" "$ZIP" artifacts/unsigned-transfer/release-compile.json)"
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          jq -r '"Compile receipt: `" + $digest + "`\n\nUnsigned executable: `" + .manifest.binarySha256 + "`\n\nProgram payload: `" + .payloadSha256 + "`"' --arg digest "$DIGEST" artifacts/unsigned-transfer/release-compile.json >> "$GITHUB_STEP_SUMMARY"

      - name: Build the exact exporter using the compiled release library
        env:
          CARGO_BUILD_JOBS: "1"
        run: |
          mkdir -p .test-output/release
          bun scripts/devtools/devtools.ts build-ops act exporter-build --profile release --features owned-ui-evaluation \
            --timeout-ms 3600000 \
            --artifact-out .test-output/release/exporter.reference.json
      - name: Prove generated design JSON and CSS match the authoritative exporter
        run: |
          mkdir -p "$RUNNER_TEMP/release-design-evidence"
          bun scripts/devtools/generated-byte-compare.ts \
            --artifact .test-output/release/exporter.reference.json \
            --source-policy clean-exact-head \
            --out .test-output/release/generated-byte-compare.json
          cp .test-output/release/generated-byte-compare.json \
            "$RUNNER_TEMP/release-design-evidence/generated-design-contracts-proof.json"
          bun scripts/release-evidence.ts gate \
            --gate generated-design-contracts \
            --class UNIT_BEHAVIOR \
            --source-sha "$GITHUB_SHA" \
            --result "$RUNNER_TEMP/release-design-evidence/generated-design-contracts-proof.json" \
            --output "$RUNNER_TEMP/release-design-evidence/generated-design-contracts.json"
      - name: Upload verified generated-design evidence
        id: upload-design
        uses: actions/upload-artifact@v4
        with:
          name: release-design-evidence
          path: ${{ runner.temp }}/release-design-evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned app bundle
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned-app
          path: artifacts/unsigned-transfer/
          if-no-files-found: error
          retention-days: 1

  build-goose-sidecar:
    name: Build goose sidecar
    runs-on: macos-15
    needs: [validate-fmt, validate-sdk-types, validate-sdk-tests]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      GOOSE_SIDECAR_REF: "302b60806639ea9f0ae8f053f49f8bf0e88b26f4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install root-pinned Rust toolchain
        run: bash scripts/install-root-rust-toolchain.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache goose sidecar Cargo target
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/goose-sidecar-target
            ~/.cargo/registry
            ~/.cargo/git
          key: goose-sidecar-${{ runner.os }}-${{ runner.arch }}-${{ env.GOOSE_SIDECAR_REF }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Prepare bundled goose sidecar
        env:
          SCRIPT_KIT_NONINTERACTIVE: "0"
          GOOSE_SIDECAR_TARGET_DIR: ${{ runner.temp }}/goose-sidecar-target
        run: bash scripts/prepare-goose-sidecar.sh

      - name: Verify goose sidecar
        run: |
          test -x target/goose-sidecar/goose
          file target/goose-sidecar/goose

      - name: Zip goose sidecar
        run: |
          cd target/goose-sidecar
          /usr/bin/ditto -c -k goose "$RUNNER_TEMP/goose-sidecar.zip"

      - name: Upload goose sidecar
        uses: actions/upload-artifact@v4
        with:
          name: goose-sidecar
          path: ${{ runner.temp }}/goose-sidecar.zip
          retention-days: 1

  sign-notarize-macos:
    name: Sign and notarize macOS app
    runs-on: macos-15
    env:
      EXPECTED_COMPILE_RECEIPT: ${{ needs.build-macos-app.outputs.compile_receipt_sha }}
    needs:
      - validate-release-gates
      - build-macos-app
      - build-goose-sidecar
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install root-pinned Rust toolchain
        run: bash scripts/install-root-rust-toolchain.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Verify the pinned toolchain, without restoring any compiler target, task registry or lease.
      - name: Require exact producer outputs
        env:
          PROOF_ID: ${{ needs.validate-release-gates.outputs.proof_id }}
          DESIGN_ID: ${{ needs.build-macos-app.outputs.design_id }}
          UNSIGNED_ID: ${{ needs.build-macos-app.outputs.unsigned_id }}
        run: |
          [[ "$DESIGN_ID" =~ ^[1-9][0-9]*$ && "$PROOF_ID" =~ ^[1-9][0-9]*$ && "$UNSIGNED_ID" =~ ^[1-9][0-9]*$ && "$EXPECTED_COMPILE_RECEIPT" =~ ^[0-9a-f]{64}$ ]]

      - name: Download executed Rust gate evidence
        uses: actions/download-artifact@v4
        with:
          name: release-rust-evidence
          path: ${{ runner.temp }}/release-evidence

      - name: Download exact generated-design gate evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-macos-app.outputs.design_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-evidence

      - name: Download DevTools and static-catalog gate evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.validate-release-gates.outputs.proof_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-evidence

      - name: Download complete SDK behavior gate evidence
        uses: actions/download-artifact@v4
        with:
          name: release-sdk-evidence
          path: ${{ runner.temp }}/release-evidence

      - name: Download the producer's exact unsigned artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-macos-app.outputs.unsigned_id }}
          merge-multiple: true
          path: artifacts/app

      - name: Verify transfer before extracting the unsigned app
        run: |
          ZIP=artifacts/app/Script-Kit-unsigned-app.zip
          bun scripts/agentic/release-compile.ts verify-zip artifacts/app/release-compile.json "$EXPECTED_COMPILE_RECEIPT" "$ZIP"
          python3 -B scripts/devtools/lib/installed-release-archive.py "$ZIP"
          mkdir -p target/release/bundle/osx .test-output/release
          /usr/bin/ditto -x -k "$ZIP" target/release/bundle/osx

      - name: Download goose sidecar
        uses: actions/download-artifact@v4
        with:
          name: goose-sidecar
          path: artifacts/goose

      - name: Restore goose sidecar
        run: |
          mkdir -p target/goose-sidecar
          /usr/bin/ditto -x -k artifacts/goose/goose-sidecar.zip target/goose-sidecar
          chmod 0755 target/goose-sidecar/goose

      - name: Install goose sidecar into bundle
        run: bash scripts/install-goose-sidecar-into-bundle.sh

      - name: Verify bundled macOS app contents
        run: |
          APP="target/release/bundle/osx/Script Kit.app"
          EXPECTED="$(bun scripts/agentic/release-compile.ts verify-executable artifacts/app/release-compile.json "$EXPECTED_COMPILE_RECEIPT" "$APP/Contents/MacOS/script-kit-gpui")"
          SCRIPT_KIT_EXPECTED_APP_SHA256="$EXPECTED" bash scripts/verify-macos-bundle.sh
          python3 -B scripts/verify_macos_deployment.py "target/release/bundle/osx/Script Kit.app"

      - name: Create temporary keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Store keychain path for later steps
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Sign with Developer ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          APP_PATH="target/release/bundle/osx/Script Kit.app"

          # Find the Developer ID Application identity
          IDENTITY="${APPLE_CODESIGN_IDENTITY:-Developer ID Application: John Lindquist ($APPLE_TEAM_ID)}"

          # Sign all nested components first (frameworks, helpers, etc.)
          find "$APP_PATH" -type d -name "*.framework" -print0 | xargs -0 -I{} codesign --force --options runtime --sign "$IDENTITY" "{}"
          find "$APP_PATH" \( -name "*.dylib" -o -name "*.so" \) -type f -print0 | xargs -0 codesign --force --options runtime --sign "$IDENTITY"

          # Sign bundled executables before the outer app bundle.
          codesign --force --options runtime --entitlements entitlements.plist --sign "$IDENTITY" "$APP_PATH/Contents/MacOS/goose"
          codesign --verify --verbose=4 "$APP_PATH/Contents/MacOS/goose"
          codesign --force --options runtime --entitlements entitlements.plist --sign "$IDENTITY" "$APP_PATH/Contents/MacOS/script-kit-gpui"

          # Sign the entire app bundle
          codesign --force --options runtime --entitlements entitlements.plist --sign "$IDENTITY" "$APP_PATH"

          # Verify signature
          codesign --verify --verbose=4 "$APP_PATH/Contents/MacOS/script-kit-gpui"
          codesign --verify --verbose=4 "$APP_PATH"
          bun scripts/agentic/release-compile.ts verify-signed-payload artifacts/app/release-compile.json "$EXPECTED_COMPILE_RECEIPT" "$APP_PATH/Contents/MacOS/script-kit-gpui"

      - name: Create zip for notarization
        run: |
          cd target/release/bundle/osx
          /usr/bin/ditto -c -k --keepParent "Script Kit.app" "Script-Kit-macos.zip"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd target/release/bundle/osx

          # Submit for notarization
          xcrun notarytool submit "Script-Kit-macos.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json > "$RUNNER_TEMP/notarization-result.json"

      - name: Staple notarization ticket
        run: /bin/bash scripts/release-stapler.sh staple "target/release/bundle/osx/Script Kit.app"

      - name: Verify post-staple Gatekeeper acceptance
        run: spctl --assess --verbose=4 --type execute "target/release/bundle/osx/Script Kit.app"

      - name: Attest exact signing, accepted notarization, stapling, and Gatekeeper identities
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ROOT="target/release/bundle/osx"
          ATTESTATION="$RUNNER_TEMP/distribution-security-attestation.json"
          bun scripts/release-evidence.ts attest-signing \
            --app "$ROOT/Script Kit.app" \
            --notarization "$RUNNER_TEMP/notarization-result.json" \
            --notarized-archive "$ROOT/Script-Kit-macos.zip" \
            --source-sha "$GITHUB_SHA" \
            --team-id "$APPLE_TEAM_ID" \
            --output "$ATTESTATION"
          bun scripts/release-evidence.ts gate \
            --gate packaged-signing \
            --class PACKAGED_IDENTITY \
            --source-sha "$GITHUB_SHA" \
            --result "$ATTESTATION" \
            --output "$RUNNER_TEMP/release-evidence/packaged-signing.json"

      - name: Publish immutable signed and stapled bundle derivation
        run: |
          bun scripts/devtools/devtools.ts build-ops act publish-signed-bundle \
            --release-input artifacts/app/release-compile.json --expected-input-sha256 "$EXPECTED_COMPILE_RECEIPT" \
            --bundle "target/release/bundle/osx/Script Kit.app" \
            --attestation "$RUNNER_TEMP/distribution-security-attestation.json" \
            --artifact-out .test-output/release/signed.reference.json

      - name: Prove the exact signed packaged binary without showing a window
        run: |
          APP_PATH="target/release/bundle/osx/Script Kit.app"
          RECEIPT=".test-output/release/packaged-root-frame.json"
          bun scripts/agentic/root-search-frame-stability.ts \
            --artifact .test-output/release/signed.reference.json --packaged \
            --receipt "$RECEIPT"
          bun scripts/release-evidence.ts gate \
            --gate packaged-root-frame \
            --class RUNTIME_HIDDEN \
            --source-sha "$GITHUB_SHA" \
            --result "$RECEIPT" \
            --output "$RUNNER_TEMP/release-evidence/packaged-root-frame.json"

      - name: Create final release zip
        run: |
          cd target/release/bundle/osx
          rm -f Script-Kit-macos.zip
          /usr/bin/ditto -c -k --keepParent "Script Kit.app" "Script-Kit-macos.zip"

      - name: Verify final release zip contents
        run: |
          TMP_DIR="$(mktemp -d)"
          /usr/bin/ditto -x -k "target/release/bundle/osx/Script-Kit-macos.zip" "$TMP_DIR"
          APP="$TMP_DIR/Script Kit.app"
          bash scripts/verify-macos-bundle.sh "$APP"
          python3 -B scripts/verify_macos_deployment.py "$APP"
          codesign --verify --deep --strict "$APP"
          /bin/bash scripts/release-stapler.sh validate "$APP"
          CHECK="$RUNNER_TEMP/installed-workspace-check.json"
          (cd "$TMP_DIR" && "$APP/Contents/MacOS/script-kit-gpui" --check-installation) >"$CHECK"
          jq -e --arg version "${GITHUB_REF_NAME#v}" --argjson packaged true -f scripts/verify-installed-workspace.jq "$CHECK" >/dev/null
          jq --arg sha "$GITHUB_SHA" --arg archive "$(shasum -a 256 target/release/bundle/osx/Script-Kit-macos.zip | cut -d' ' -f1)" '. + {sourceSha:$sha, zipSha256:$archive}' "$CHECK" >target/release/bundle/osx/installed-workspace-check.json

      - name: Record advisory packaged-journey scorecard
        # Advisory until the owner ratifies the paint budget and authorizes capture sessions.
        continue-on-error: true
        run: |
          ROOT="target/release/bundle/osx"
          bun scripts/release-evidence.ts packaged-readiness \
            --app "$ROOT/Script Kit.app" \
            --evidence-dir "$RUNNER_TEMP/release-evidence" \
            --source-sha "$GITHUB_SHA" \
            --output "$ROOT/release-scorecard.json"

      - name: Upload packaged release scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-scorecard
          path: target/release/bundle/osx/release-scorecard.json
          if-no-files-found: warn

      - name: Generate release manifest
        run: |
          ROOT="target/release/bundle/osx"
          cp "$RUNNER_TEMP/release-evidence/generated-design-contracts-proof.json" \
            "$ROOT/generated-design-contracts-proof.json"
          bun scripts/release-evidence.ts manifest \
            --zip "$ROOT/Script-Kit-macos.zip" \
            --app "$ROOT/Script Kit.app" \
            --contracts docs/ai/contracts/surface-contracts.json \
            --design-tokens design/mockups/generated/tokens.json \
            --design-css design/mockups/generated/tokens.css \
            --design-proof "$ROOT/generated-design-contracts-proof.json" \
            --source-sha "$GITHUB_SHA" \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "$GITHUB_REF_NAME" \
            --evidence "$RUNNER_TEMP/release-evidence/rust-tests.json" \
            --evidence "$RUNNER_TEMP/release-evidence/integration-tests.json" \
            --evidence "$RUNNER_TEMP/release-evidence/domain-tests.json" \
            --evidence "$RUNNER_TEMP/release-evidence/first-run-fixtures.json" \
            --evidence "$RUNNER_TEMP/release-evidence/permissions-fixtures.json" \
            --evidence "$RUNNER_TEMP/release-evidence/mock-ai-fixtures.json" \
            --evidence "$RUNNER_TEMP/release-evidence/privacy-fixtures.json" \
            --evidence "$RUNNER_TEMP/release-evidence/proof-contracts.json" \
            --evidence "$RUNNER_TEMP/release-evidence/generated-design-contracts.json" \
            --evidence "$RUNNER_TEMP/release-evidence/consistency-catalog.json" \
            --evidence "$RUNNER_TEMP/release-evidence/sdk-tests.json" \
            --evidence "$RUNNER_TEMP/release-evidence/packaged-signing.json" \
            --evidence "$RUNNER_TEMP/release-evidence/packaged-root-frame.json" \
            --evidence "$RUNNER_TEMP/release-evidence/packaged-first-install.json" \
            --evidence "$RUNNER_TEMP/release-evidence/packaged-permissions.json" \
            --evidence "$RUNNER_TEMP/release-evidence/packaged-migration.json" \
            --evidence "$RUNNER_TEMP/release-evidence/packaged-mock-ai.json" \
            --evidence "$RUNNER_TEMP/release-evidence/packaged-direct-matrix.json" \
            --evidence "$RUNNER_TEMP/release-evidence/packaged-ratified-performance.json" \
            --output "$ROOT/release-manifest.json"

      - name: Fail closed on stale, wrong-binary, missing, or unsafe release evidence
        run: |
          ROOT="target/release/bundle/osx"
          bun scripts/release-evidence.ts verify \
            --manifest "$ROOT/release-manifest.json" \
            --zip "$ROOT/Script-Kit-macos.zip" \
            --app "$ROOT/Script Kit.app" \
            --design-tokens design/mockups/generated/tokens.json \
            --design-css design/mockups/generated/tokens.css \
            --design-proof "$ROOT/generated-design-contracts-proof.json" \
            --source-sha "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME"

      - name: Generate honest packaged release scorecard
        run: |
          ROOT="target/release/bundle/osx"
          bun scripts/release-evidence.ts scorecard \
            --manifest "$ROOT/release-manifest.json" \
            --zip "$ROOT/Script-Kit-macos.zip" \
            --app "$ROOT/Script Kit.app" \
            --design-tokens design/mockups/generated/tokens.json \
            --design-css design/mockups/generated/tokens.css \
            --design-proof "$ROOT/generated-design-contracts-proof.json" \
            --source-sha "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --output "$ROOT/release-scorecard.json"

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            target/release/bundle/osx/Script-Kit-macos.zip
            target/release/bundle/osx/installed-workspace-check.json
            target/release/bundle/osx/release-manifest.json
            target/release/bundle/osx/release-scorecard.json
            target/release/bundle/osx/generated-design-contracts-proof.json

  release:
    name: Create Release
    permissions:
      contents: write
    needs:
      - validate-release-gates
      - sign-notarize-macos
    if: >-
      ${{
        needs['validate-release-gates'].result == 'success' &&
        needs['sign-notarize-macos'].result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts

      - name: Verify exact archived artifact and all mandatory release evidence
        run: |
          bun scripts/release-evidence.ts verify \
            --manifest artifacts/release-manifest.json \
            --zip artifacts/Script-Kit-macos.zip \
            --design-tokens design/mockups/generated/tokens.json \
            --design-css design/mockups/generated/tokens.css \
            --design-proof artifacts/generated-design-contracts-proof.json \
            --source-sha "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            artifacts/installed-workspace-check.json
            artifacts/Script-Kit-macos.zip
            artifacts/release-manifest.json
            artifacts/release-scorecard.json
            artifacts/generated-design-contracts-proof.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
